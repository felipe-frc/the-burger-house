# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Restore dependencies
        run: dotnet restore backend/BurgerHouse.sln

      - name: Build
        run: dotnet build backend/BurgerHouse.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/BurgerHouse.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish backend/BurgerHouse.Api/BurgerHouse.Api.csproj --configuration Release --no-build --output ${{ env.DOTNET_ROOT }}/myapp /p:UseAppHost=false

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp
