name: Official storefront
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'feature/**', 'chore/**']
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            owner-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm ci --prefix owner-ui
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:frontend
      - run: npm --prefix owner-ui test
      - run: npm run build
      - run: npm run build:owner
      - uses: actions/upload-artifact@v4
        with:
          name: official-storefront
          path: frontend/dist/
